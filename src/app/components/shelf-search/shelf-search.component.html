<div id="search-component">
  <label for="search-box">Shelf Search</label>
  <input #searchBox id="search-box" (input)="search(searchBox.value)" />

  <ul class="search-result">
    <li *ngFor="let shelf of shelves$ | async" >
      <a routerLink="/detail/{{shelf.id}}">
        {{shelf.name}}
      </a>
    </li>
  </ul>
</div>
