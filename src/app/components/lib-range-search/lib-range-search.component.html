<div id="search-component">
  <label for="search-box">LibRange Search</label>
  <input #searchBox id="search-box" (input)="search(searchBox.value)" />

  <ul class="search-result">
    <li *ngFor="let libRange of libRanges$ | async" >
      <a routerLink="/detail/{{libRange.id}}">
        {{libRange.name}}
      </a>
    </li>
  </ul>
</div>
