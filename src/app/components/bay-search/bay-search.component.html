<div id="search-component">
  <label for="search-box">Bay Search</label>
  <input #searchBox id="search-box" (input)="search(searchBox.value)" />

  <ul class="search-result">
    <li *ngFor="let bay of bays$ | async" >
      <a routerLink="/detail/{{bay.id}}">
        {{bay.name}}
      </a>
    </li>
  </ul>
</div>
